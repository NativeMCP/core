[package]
name = "nmcp-router"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
categories.workspace = true
keywords.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
description = "ToolProvider trait, Router, and middleware ring for the Model Context Platform."

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
nmcp-audit = { path = "../nmcp-audit", version = "0.1.0" }
nmcp-identity.workspace = true
nmcp-policy = { path = "../nmcp-policy", version = "0.1.0" }
nmcp-schema = { path = "../nmcp-schema", version = "0.1.0" }
# Ring stage 5b (NMCP-SPEC-002 SB-5, I-034): the ring holds the store handle and wires
# binding evaluation to resolution. A new production edge, verified acyclic with cargo tree:
# `nmcp-secrets -> nmcp-schema -> nmcp-policy -> nmcp-identity` and nothing in that chain
# reaches back here. NMCP-SPEC-002's architecture block says "nmcp-host: stage 5b
# resolution"; the ring is one function and it lives in this crate until I-031 moves
# composition, and NMCP-SPEC-003 4.6, the governing frozen text, constrains the stage's
# position rather than its crate.
nmcp-secrets = { path = "../nmcp-secrets", version = "0.1.0" }
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
# The ring itself no longer names the attribute: `ToolProvider` moved to `nmcp-schema`,
# which carries the dependency now. The test providers in this crate still implement an
# async trait method, so the edge is real and is classified where it is used.
async-trait.workspace = true
# The registry the ring dispatches through. NMCP-SPEC-003 RC-D1 puts the index in
# `nmcp-host` and the trait in `nmcp-schema`, and fixes the edge between those two crates as
# `nmcp-host -> nmcp-router`. That edge is not present yet and arrives at I-031 with the
# server runtime; what matters now is that it is the declared direction, so this edge stays
# test-only and never becomes a production one. I-049 tested that: wiring `RequestState` into
# dispatch would have been trivial with a production edge here, and taking it would have made
# I-031 a dependency cycle, so `RequestState` moved to `nmcp-schema` at spec v1.4 instead.
# Writing a second index here to avoid this dev edge would mean every ring assertion in this
# crate was measured against a fake.
nmcp-host = { path = "../nmcp-host", version = "0.1.0" }
# Test-only, and only for RC-6's oracle: the deleted `tool_policy_spec` table's path-argument
# lists are graded against the shipped first-party input schemas, which live here. It was a
# production dependency until I-047d, for `tool_annotations`, which RC-8 deletes.
nmcp-proto = { path = "../nmcp-proto", version = "0.1.0" }
