# cargo-deny policy. Supply chain rules are enforced in CI, not advisory.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# The one entry, named here rather than left implicit, in the same discipline the licence
# section uses: an exception is a reviewed decision recorded in the file, never a silent
# addition.
ignore = [
    # RUSTSEC-2023-0071, the Marvin attack: a timing sidechannel in the pure-Rust `rsa` crate
    # that can recover a **private** key from an attacker who can observe the timing of
    # operations using it. Unpatched upstream; the advisory's own text says the only workaround
    # is to avoid the crate.
    #
    # It does not apply to this graph, and the reason is structural rather than a judgement
    # about likelihood. `rsa` arrives through `jsonwebtoken`'s `rust_crypto` backend, which
    # `nmcp-authn` uses to VERIFY inbound bearer tokens. Verification is a public-key operation.
    # `nmcp-authn` constructs `DecodingKey` and never `EncodingKey` (three uses to zero), every
    # key arrives as a public JWK over an issuer's metadata endpoint, and no RSA private key
    # exists anywhere in this process. A sidechannel that recovers a private key cannot recover
    # one that is not there.
    #
    # All three alternatives were worse, and the third was measured rather than reasoned about.
    # Staying on `jsonwebtoken` 9 keeps GHSA-h395-gr6q-cpjc, a type confusion leading to
    # authorization bypass, in the crate whose whole job is deciding whether a token may be
    # accepted. The `aws_lc_rs` backend pulls the aws-lc tree, whose OpenSSL licence component
    # sits outside the allow list below and which this workspace already declined once, for
    # `reqwest`. And a backend-free bump to 10.x, which is what Dependabot proposed and what
    # carries neither `rsa` nor `ring`, **panics at the first verification**: "Could not
    # automatically determine the process-level CryptoProvider from jsonwebtoken crate
    # features". A remote caller presenting any token would take the listener down.
    #
    # Revisit if this workspace ever SIGNS a JWT. At that moment a private key enters the
    # process, the reasoning above stops holding, and this entry must go rather than be widened.
    "RUSTSEC-2023-0071",
]

[licenses]
version = 2
# Permissive licenses only. Any copyleft entering the graph is a reviewed
# decision recorded as an exception below, never a silent addition.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
exceptions = []
# The allow list is the policy, not a record of what is currently in the
# graph. Warning on entries nothing has used yet turns every run into noise,
# and a gate people stop reading is not a gate.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/NativeMCP/core"]
