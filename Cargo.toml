[workspace]
resolver = "3"
members = [
"xtask",
"crates/nmcp-inspector",
"crates/nmcp-devtools",
"crates/nmcp-reports",
"crates/nmcp-local",
"crates/nmcp-serve",
"crates/nmcp-authn",
"crates/nmcp-serve-assets",
"crates/nmcp-abac",
"crates/nmcp-router",
"crates/nmcp-transport",
"crates/nmcp-fs",
"crates/nmcp-exec",
"crates/nmcp-memory",
"crates/nmcp-identity",
"crates/nmcp-proto",
"crates/nmcp-policy",
"crates/nmcp-schema",
"crates/nmcp-audit",
"crates/nmcp-host",
"crates/nmcp-secrets",
"crates/nmcp-oauth",
"crates/nmcp-gateway",
"crates/nmcpctl",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
authors = ["Madewell R&D LLC"]
repository = "https://github.com/NativeMCP/core"
homepage = "https://github.com/NativeMCP"
readme = "README.md"
keywords = ["mcp", "governance", "audit", "policy"]
categories = ["network-programming"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# INV-1 and INV-5: a panic in a privileged local service is an availability
# failure with an audit gap attached. These are denied, not discouraged.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
module_name_repetitions = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
debug = "line-tables-only"

[workspace.dependencies]
clap = { version = "4.5.26", features = ["derive", "env"] }
axum = { version = "0.7.9", features = ["ws"] }
tracing = "0.1.41"
walkdir = "2.5.0"
nmcp-identity = { path = "crates/nmcp-identity", version = "0.2.0" }
regex = "1.11.1"
async-trait = "0.1.83"
uuid = { version = "1.12.1", features = ["v4", "serde"] }
tokio = { version = "1.43.0", features = ["full"] }
sha2 = "0.10.8"
parking_lot = "0.12.3"
anyhow = "1.0.95"
thiserror = "2.0.11"
serde_json = "1.0.135"
serde = { version = "1.0.217", features = ["derive"] }
chrono = { version = "0.4.39", features = ["serde"] }
# NMCP-SPEC-002 additions, each an INV-7 reviewed change the specification requests
# rather than assumes. SB-1 names `zeroize` for erasure of material on drop. The core
# file sealer's cipher is a maintained AEAD rather than a construction written and
# reviewed nowhere, which is the alternative SB-A7 exists to prevent; its keys and
# nonces come from the operating system generator, with no seedable fallback. `hex`
# is the at-rest encoding for sealed blobs inside the store's JSON documents.
zeroize = "1.9.0"
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
hex = "0.4.3"
# I-037/I-038 addition, an INV-7 reviewed change: the no-echo prompt for
# `nmcpctl secret set` and `secret rotate` (NMCP-SPEC-002 SB-R1, SB-13). The
# value arrives over the terminal with echo disabled or over piped stdin, and
# never as an argument; a CLI that took the value on argv would publish it to
# every process listing (T5), which is the modality SB-A2 removed by
# construction. Apache-2.0/MIT, inside the deny.toml allow list.
rpassword = "7.5.4"
# I-017 addition, an INV-7 reviewed change: the OAuth broker's outbound HTTP
# client, for the RFC 8628 device flow and token refresh. The hyper 1 family it
# rides on is already in this graph through axum; the additions are reqwest
# itself and the platform TLS stack. Default features are off: `native-tls` is
# chosen over the 0.13-era rustls default because the aws-lc tree that default
# pulls in carries an OpenSSL license component outside deny.toml's allow list,
# while the native-tls path (openssl bindings on Linux, schannel on Windows,
# Security.framework on macOS) is MIT/Apache-2.0 throughout, hand-checked.
# `json` is the response-body decoding the token endpoints speak.
reqwest = { version = "0.12.28", default-features = false, features = ["json", "native-tls"] }
# I-074 addition, an INV-7 reviewed change: the inbound resource-server half of OAuth
# (NMCP-PLAN-002 finding F-1) decodes and verifies a bearer token's JWT, which the
# outbound broker in `nmcp-oauth` never had to do. `jsonwebtoken` is the algorithm
# allowlist, the JWKS key type and the signature check, and RS-9's rule that `none`
# and any algorithm outside the list is refused is enforced against its `Algorithm`
# rather than against a string this repository parses. MIT, inside deny.toml's allow
# list. Default features off: the `use_pem` default pulls a PEM parser this crate has
# no use for, because every key arrives as a JWK over the metadata endpoint.
jsonwebtoken = { version = "10.3.0", default-features = false }
