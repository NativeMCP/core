name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  format:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.97.1
          components: rustfmt
      - run: cargo fmt --all -- --check

  lint:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.97.1
          components: clippy
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.97.1
      - run: cargo build --workspace --all-features --locked
      - run: cargo test --workspace --all-features --locked

  supply-chain:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  governance:
    name: governance gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "INV-6: no stubs, no placeholder markers"
        shell: bash
        run: |
          set -euo pipefail
          # INV-6 forbids placeholder work anywhere in tracked sources.
          # This gate is why "no stubs" is a property of the repository and
          # not a promise in a document.
          #
          # The marker pattern is assembled from fragments so that this file
          # does not itself contain the tokens it rejects. A gate that trips
          # on its own definition is a gate nobody keeps.
          MARKERS="$(printf '%s' 'TO''DO' '|' 'FIX''ME' '|' 'XX''X' '|' 'HA''CK')"
          if git grep -n -E '\b(todo!|unimplemented!|unreachable!)\s*\(' -- '*.rs'; then
            echo "::error::INV-6 violation: placeholder macro present in tracked Rust sources."
            exit 1
          fi
          if git grep -n -E "(^|[^A-Za-z])($MARKERS)([^A-Za-z]|$)" \
               -- '*.rs' '*.toml' '*.ps1' '*.sh' '*.wxs'; then
            echo "::error::INV-6 violation: placeholder marker present. Name the gap in an issue instead."
            exit 1
          fi
          echo "INV-6 gate passed."
      - name: workflow definitions parse
        shell: bash
        run: |
          set -euo pipefail
          # A workflow with a YAML error is accepted by GitHub, listed as
          # active, and never runs. Without this step a broken required
          # check is indistinguishable from a passing one.
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 -c "
          import pathlib, sys, yaml
          bad = 0
          for f in sorted(pathlib.Path('.github/workflows').glob('*.y*ml')):
              try:
                  doc = yaml.safe_load(f.read_text())
              except Exception as exc:
                  print('::error file=' + str(f) + '::YAML parse failure: ' + str(exc))
                  bad += 1
                  continue
              if not isinstance(doc, dict):
                  print('::error file=' + str(f) + '::workflow is not a mapping')
                  bad += 1
                  continue
              if not doc.get('name'):
                  print('::error file=' + str(f) + '::workflow has no top-level name')
                  bad += 1
              if not doc.get('jobs'):
                  print('::error file=' + str(f) + '::workflow declares no jobs')
                  bad += 1
              else:
                  print(str(f) + ' ok: ' + str(doc['name']) + ' -> ' + ', '.join(doc['jobs']))
          sys.exit(1 if bad else 0)
          "
      - name: "INV-1: no destructive filesystem primitives"
        shell: bash
        run: |
          set -euo pipefail
          # INV-1 forbids destructive primitives in any dependency path
          # reachable from a tool handler (GOVERNANCE.md). The scanner enforces
          # exactly that scope: production code only, excluding cfg(test)
          # modules (compiled out of the release binary) and comments. A
          # line-oriented grep could tell neither a comment from a call nor a
          # test from a handler. See scripts/inv1_scan.py.
          python3 scripts/inv1_scan.py
      - name: "INV-8: no legacy brand references"
        shell: bash
        run: |
          set -euo pipefail
          # NMCP-SPEC-001 R-6. The pattern is assembled from fragments so
          # that this file does not itself contain the names it rejects,
          # the same technique as the INV-6 gate above.
          A="$(printf '%s%s' 'Signal' 'Desk')"
          B="$(printf '%s%s%s' 'windows' '-local-' 'repo')"
          P="(${A}|${B})"
          if git grep -n -i -E "$P"; then
            echo "::error::INV-8 violation: legacy brand reference present."
            exit 1
          fi
          echo "INV-8 gate passed."
